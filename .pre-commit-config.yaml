ci:
  skip: [selene]

repos:
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.26.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ['@commitlint/config-conventional']

  - repo: https://github.com/JohnnyMorganz/StyLua
    rev: v2.5.2
    hooks:
      - id: stylua-system
        args: [--check]
        types: [file]
        files: (\.luau?$|(^|/)[^./]+$)

  - repo: local
    hooks:
      - id: selene
        name: selene
        entry: selene
        language: system
        files: (\.luau?$|(^|/)[^./]+$)
